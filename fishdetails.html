<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Details</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f3f3; margin:0; padding:20px; }
    .details-container { max-width:800px; margin:auto; background:#fff; padding:25px; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,0.2);}    
    .details-container img { width:100%; height:350px; object-fit:cover; border-radius:10px; }
    h1 { margin-top:20px; }
    .info { margin-top:15px; color:#444; line-height:1.6; font-size:18px; }
    .grid { display:flex; justify-content:space-between; margin-top:15px; }
    .grid div { width:48%; background:#fafafa; padding:15px; border-radius:10px; }
    .back { margin-top:25px; display:inline-block; padding:10px 25px; background:#007bff; color:white; border-radius:10px; text-decoration:none; font-size:18px; }
    .back:hover { background:#0056b3; }
  </style>
</head>
<body>

<a href="package.html" class="back">⬅ Back to Fishes</a>
<div class="details-container" id="fishDetails"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const fishName = params.get("name");

  fetch("data/fishes.json")
    .then(res => res.json())
    .then(data => {
      const fish = data.find(f => f.name === fishName);
      if (!fish) {
        document.getElementById("fishDetails").innerHTML = `<h2>Fish details not found!</h2>`;
        return;
      }

      document.getElementById("fishDetails").innerHTML = `
        <img src="${fish.image}" alt="${fish.name}">
        <h1>${fish.name}</h1>
        <p class="info">${fish.description || fish.long_description}</p>
        <div class="grid">
          <div>
            <p><b>Life Span:</b> ${fish.age}</p>
            <p><b>Color:</b> ${fish.colors}</p>
          </div>
          <div>
            <p><b>Size:</b> ${fish.size}</p>
            <p><b>Water Type:</b> ${fish.water_type}</p>
          </div>
        </div>
      `;
    });
</script>

</body>
</html>
